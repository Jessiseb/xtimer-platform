
server:
  port: 8082

spring:
  application:
    name: bitstorm-svr-xtimer
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: change_me
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/bitstorm-svr?serverTimezone=GMT%2B8&characterEncoding=utf8&&allowMultiQueries=true&useSSL=false
    username: root
    password: change_me
    type: com.alibaba.druid.pool.DruidDataSource
#    druid:
#      min-idle: 1                                          # 最小连接数
#      max-active: 100                                         # 最大连接数(默认8)
#      max-wait: 1000                                       # 获取连接时的最大等待时间
#      min-evictable-idle-time-millis: 300000               # 一个连接在池中最小生存的时间，单位是毫秒
#      time-between-eviction-runs-millis: 60000             # 多久才进行一次检测需要关闭的空闲连接，单位是毫秒

  redis:
    host: 119.91.227.162
    port: 6338
    password: change_me
    database: 5
    jedis:
      pool:
        max-active: 8 #最大连接数


mybatis:
  mapper-locations: classpath:mapper/*.xml
  #开启驼峰命名
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl


#xTimer相关配置
scheduler:
   bucketsNum: 5 # 桶数
   tryLockSeconds: 70 #获得所成功后的锁过期时间
   tryLockGapMilliSeconds: 100 # 每次尝试获得锁的间隔为100毫秒
   successExpireSeconds: 130 # 锁成功过期后的过期时间
   pool:
    corePoolSize: 10 #核心线程数
    maxPoolSize: 100 # 最大线程数
    queueCapacity: 99999 #队列容量
    namePrefix: scheduler- #线程名称


trigger:
   zrangeGapSeconds: 1
   workersNum: 10000
   pool:
     corePoolSize: 10
     maxPoolSize: 100
     queueCapacity: 99999
     namePrefix: trigger-

migrator:
   workersNum: 1000 # 同时执行迁移任务的最大工作线程数
   migrateStepMinutes: 60 # 每次迁移任务的时间步长（分钟）
   migrateTryLockMinutes: 1 # 尝试获取迁移锁的持续时间（分钟）
   migrateSuccessExpireMinutes: 1 # 迁移成功后的过期时间（分钟）
   timerDetailCacheMinutes: 2 # 时间详情缓存的持续时间（分钟）

logging:
  config: classpath:logback.xml
  level:
    com.bitoffer.xtimer: info
    org.springframework: warn




