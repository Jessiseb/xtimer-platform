<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 372" width="100%" role="img">
  <title>xtimer 四段式执行链路</title>
  <desc>业务方创建定时器后，经 Migrator、Scheduler、Trigger、Executor 四个阶段完成 HTTP 回调，数据落在 MySQL 与 Redis。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#57606a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
    <rect x="30" y="40" width="140" height="64" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="100" y="66" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="500">业务方 / 管理端</text>
    <text x="100" y="86" font-size="12.5" fill="#57606a" text-anchor="middle">创建 · 启停定时器</text>

    <rect x="190" y="40" width="140" height="64" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="260" y="66" font-size="15" fill="#0a3069" text-anchor="middle" font-weight="500">Migrator</text>
    <text x="260" y="86" font-size="12.5" fill="#0a3069" text-anchor="middle">每 10s 抢锁 · 按小时互斥</text>

    <rect x="350" y="40" width="140" height="64" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="420" y="66" font-size="15" fill="#0a3069" text-anchor="middle" font-weight="500">Scheduler</text>
    <text x="420" y="86" font-size="12.5" fill="#0a3069" text-anchor="middle">每秒 × 5 个桶</text>

    <rect x="510" y="40" width="140" height="64" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="580" y="66" font-size="15" fill="#0a3069" text-anchor="middle" font-weight="500">Trigger</text>
    <text x="580" y="86" font-size="12.5" fill="#0a3069" text-anchor="middle">窗口内每秒扫描</text>

    <rect x="670" y="40" width="140" height="64" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="740" y="66" font-size="15" fill="#0a3069" text-anchor="middle" font-weight="500">Executor</text>
    <text x="740" y="86" font-size="12.5" fill="#0a3069" text-anchor="middle">triggerPool 线程</text>

    <rect x="830" y="40" width="140" height="64" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="900" y="66" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="500">业务服务</text>
    <text x="900" y="86" font-size="12.5" fill="#57606a" text-anchor="middle">HTTP 回调目标</text>

    <path d="M172 72 H186" fill="none" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>
    <path d="M332 72 H346" fill="none" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>
    <path d="M492 72 H506" fill="none" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>
    <path d="M652 72 H666" fill="none" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>
    <path d="M812 72 H826" fill="none" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>

    <rect x="160" y="230" width="180" height="60" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
    <text x="250" y="255" font-size="14.5" fill="#4d2d00" text-anchor="middle" font-weight="500">xtimer 表 · MySQL</text>
    <text x="250" y="274" font-size="12.5" fill="#7a4f01" text-anchor="middle">定时器定义与 cron</text>

    <rect x="470" y="230" width="170" height="60" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
    <text x="555" y="255" font-size="14.5" fill="#4d2d00" text-anchor="middle" font-weight="500">ZSET · Redis</text>
    <text x="555" y="274" font-size="12.5" fill="#7a4f01" text-anchor="middle">分钟桶_桶号 → timerId_unix</text>

    <rect x="650" y="230" width="180" height="60" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
    <text x="740" y="255" font-size="14.5" fill="#4d2d00" text-anchor="middle" font-weight="500">timer_task 表 · MySQL</text>
    <text x="740" y="274" font-size="12.5" fill="#7a4f01" text-anchor="middle">执行实例 · 状态 · output</text>

    <path d="M260 226 V110" fill="none" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <text x="268" y="170" font-size="12" fill="#57606a">读启用任务</text>

    <path d="M580 226 V110" fill="none" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <text x="588" y="170" font-size="12" fill="#57606a">ZRANGEBYSCORE</text>

    <path d="M740 110 V226" fill="none" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <text x="748" y="170" font-size="12" fill="#57606a">回写 status / costTime / output</text>

    <text x="30" y="330" font-size="12.5" fill="#57606a">冷热分离：只物化未来 2 小时的任务实例　·　分桶：timerId % 5　·　锁粒度：分钟 + 桶号</text>
    <text x="30" y="352" font-size="12.5" fill="#57606a">失败重试：分片成功则延长锁至 130s，失败不续期，下一分钟重放可抢到锁</text>
  </g>
</svg>
