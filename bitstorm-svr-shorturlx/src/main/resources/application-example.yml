server:
  port: 6080
spring:
  application:
    name: bitstorm-svr-shorturlx
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1
        username: nacos
        password: change_me

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/shorturlx?serverTimezone=GMT%2B8&characterEncoding=utf8&useSSL=false
    username: root
    password: change_me
  redis:
    host: 127.0.0.1
    port: 6379
    password: change_me
    database: 6
    jedis:
      pool:
        max-active: 8 #最大连接数
logging:
  level:
    root: DEBUG

mybatis:
  mapper-locations: classpath:mapper/*.xml
  #开启驼峰命名
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl


app:
  workId: 1
  workerIdBits: 10
